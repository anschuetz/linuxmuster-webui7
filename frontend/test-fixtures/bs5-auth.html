<!doctype html><html lang="de"><head><meta charset="utf-8"></head><body class="customized widescreen-mode-off">
<!-- auth-components.mjs authPage/primary/field; P132 card, password eye, reset and native TOTP. -->
<nav class="navbar navbar-default navbar-fixed-top" data-check="auth-navbar"><div class="container"><a class="navbar-brand">Schulkonsole</a></div></nav>
<div class="container"><div class="row"><div class="content shell-content">
<div class="container auth-page" data-check="auth-page"><div class="row" id="login-form" data-check="login-form"><div class="col-sm-4"></div><div class="col-sm-4 auth-card" data-check="auth-card"><h1 class="text-center" data-check="auth-heading">Anmelden</h1><form><div class="form-group"><input class="form-control" name="user" placeholder="Benutzername" data-check="auth-user"></div><div class="form-group has-feedback"><input class="form-control" name="password" type="password" placeholder="Passwort" data-check="auth-password"><button type="button" class="auth-password-toggle form-control-feedback" data-check="password-eye">◉</button></div><button class="btn btn-primary btn-block" data-check="auth-submit">Anmelden</button><button class="btn btn-primary btn-block" data-check="auth-reset">Passwort zurücksetzen und versenden</button></form></div><div class="col-sm-4"></div></div></div>
<dialog open class="auth-dialog" data-check="auth-dialog"><div class="modal-header" data-check="auth-dialog-header"><h4>TOTP-Verifizierungscode:</h4></div><div class="modal-body" data-check="auth-dialog-body"><div class="input-group"><input class="form-control" name="code" data-check="auth-code"></div></div><div class="modal-footer" data-check="auth-dialog-footer"><button class="btn btn-default btn-flat" data-check="auth-cancel">Abbrechen</button></div></dialog>
</div></div></div></body></html>
